name: Release new version

on:
  workflow_dispatch:
    inputs:
      version:
        description: The ID of the new version
        required: true
        type: string

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        name: Login to Dockerhub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build runtime image
        run: docker build --tag dominichickie/benthos-sqs-fifo:latest --tag dominichickie/benthos-sqs-fifo:${{ inputs.version }} --target run .
      - name: Push latest
        run: docker push dominichickie/benthos-sqs-fifo:latest
      - name: Push version
        run: docker push dominichickie/benthos-sqs-fifo:${{ inputs.version }}
